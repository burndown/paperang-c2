# Printer attributes for ippeveprinter (-a). Roll paper, 110 mm wide, 300 dpi.
ATTR keyword media-supported iso_dl_110x220mm
ATTR keyword media-default iso_dl_110x220mm
ATTR collection media-size-supported {MEMBER integer x-dimension 11000 MEMBER integer y-dimension 22000}
ATTR collection media-col-default {MEMBER collection media-size {MEMBER integer x-dimension 11000 MEMBER integer y-dimension 22000} MEMBER keyword media-source "main" MEMBER keyword media-type "stationery" MEMBER integer media-bottom-margin 0 MEMBER integer media-left-margin 0 MEMBER integer media-right-margin 0 MEMBER integer media-top-margin 0}
ATTR integer media-bottom-margin-supported 0
ATTR integer media-left-margin-supported 0
ATTR integer media-right-margin-supported 0
ATTR integer media-top-margin-supported 0
ATTR resolution printer-resolution-default 300dpi
ATTR resolution printer-resolution-supported 300dpi
ATTR keyword print-color-mode-supported monochrome
ATTR keyword print-color-mode-default monochrome
ATTR text printer-make-and-model "Paperang C2"
ATTR text printer-info "Paperang C2 thermal roll printer"
ATTR integer pages-per-minute 2
# Do NOT add document-format-supported here: ippeveprinter then publishes it twice (-f is rejected with -a).
# By default it accepts application/octet-stream, image/pwg-raster and image/urf, which is what iOS/macOS send.
